Features:
  position: number 
  mirrored: char
   
Block:
  Attention:
    - Head:
        Query: ['$']
        Key: EMB
        Value: POS
        Proj: position
  FeedForward:
    - position = position - POS

Block:
  Attention:
    - Head:
        Query: position
        Key: POS
        Value: EMB
        Proj: mirrored
  FeedForward:
    - 

Unembed:
  Char: mirrored
  Tokens: 1:-1
